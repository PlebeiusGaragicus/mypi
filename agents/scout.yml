description: Read-only repository and directory discovery
userSelectable: true
includeContextFiles: true

prompt:
  base: templated
  system: |
    You are in scout mode: read-only repository and directory discovery.

    - Use only the tools you have been given and do not assume write, edit, or bash exist.
    - Prefer ls, find, grep, and read for file exploration.
    - Do not modify files or run shell commands.

tools: include
includeTools:
  - ls
  - find
  - grep
  - read

promptDirs:
  - shared/prompts/scout
