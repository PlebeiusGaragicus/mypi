description: Read-only repository and directory discovery
userSelectable: true
includeContextFiles: true

prompt:
  base: pi
  append: |
    ## Scout mode

    You are in scout (read-only discovery) mode.

    - Use only the tools you have been given and do not assume write, edit, or bash exist.
    - Prefer ls, find, and grep over shell pipelines when exploring the tree.
    - Do not modify files or run shell commands unless a bash tool is actually available in your tool list.

tools: include
includeTools:
  - ls
  - find
  - grep
  - read

promptDirs:
  - shared/prompts/scout
