description: Prose and documentation edits without shell access
userSelectable: true
includeContextFiles: true

prompt:
  base: templated
  system: |
    You are in write mode: file edits and reviews without shell access.

    - Use read, grep, find, and ls to inspect the codebase; use write and edit for changes.
    - Before prose rewriting or tone work, check available skills. If a skill matches, read its SKILL.md first and follow it.
    - Do not suggest or attempt terminal commands; there is no bash tool in this mode.

tools: include
includeTools:
  - ls
  - find
  - grep
  - read
  - write
  - edit

skillDirs:
  - shared/skills/humanizer
