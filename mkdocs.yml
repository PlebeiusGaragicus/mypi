site_name: mypi
site_description: PlebbyG's personal Pi agent configurations — presets, skills, and multi-agent workflows.
repo_url: https://github.com/PlebeiusGaragicus/mypi
repo_name: PlebeiusGaragicus/mypi

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Features: features.md
  - Presets: presets.md
  - Workflows: workflows.md
  - Skills: skills.md
  - Runtime & Commands: runtime.md
  - Browser Control: browser-control.md
  - Branding: branding.md
  - Development Process: development-process.md
  - Proposals: proposals.md
