name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-runtime:
    name: Browser runtime checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: utilities/browser-runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Browser tests drive a real Chromium and are unreliable on GitHub
      # runners — run them locally with `bun test test/` instead.
      - name: Build runtime
        run: bun run build

  changelog-shape:
    name: Changelog shape
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate changelog sections
        run: |
          test -f CHANGELOG.md
          grep -q '^## \[Unreleased\]' CHANGELOG.md
          grep -q '^### Breaking Changes' CHANGELOG.md
          grep -q '^### Added' CHANGELOG.md
          grep -q '^### Changed' CHANGELOG.md
          grep -q '^### Fixed' CHANGELOG.md
          grep -q '^### Removed' CHANGELOG.md
          grep -q '^### Security' CHANGELOG.md

  preset-config:
    name: Preset configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate preset files
        run: npm run presets:check

      - name: Run preset runtime tests
        run: npm run presets:test

      - name: Run runtime env tests
        run: npm run runtime-env:test
